<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio</title>
  <meta name="description" content="An interactive portfolio: scroll to drive down the road past my skills and projects.">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='10' width='56' height='44' rx='8' fill='%230e6b3e' stroke='white' stroke-width='4'/%3E%3Cpath d='M32 18l12 14h-8v14h-8V32h-8z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Overpass:wght@600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loader" class="loader" role="status">
    <div class="loader-dial" aria-hidden="true"><span></span></div>
    <p>Starting the engine…</p>
  </div>

  <canvas id="scene" aria-hidden="true"></canvas>

  <header class="topbar">
    <a id="brand" class="brand" href="#">
      <span id="brandBadge" class="brand-badge"></span>
      <span id="brandName" class="brand-name"></span>
    </a>
    <nav id="route" class="route" aria-label="Sections"></nav>
    <button id="radioToggle" class="mode-toggle radio-toggle" type="button" aria-expanded="false" aria-controls="radio" aria-label="Radio">♪</button>
    <button id="modeToggle" class="mode-toggle" type="button" aria-pressed="false">Text version</button>
  </header>

  <aside id="card" class="card" aria-live="polite" inert></aside>

  <!-- windshield frame (A-pillars, roof, visors) and the rearview mirror, over the 3D view -->
  <div id="windshield" class="cabin windshield-wrap" aria-hidden="true"></div>
  <div class="mirror" aria-hidden="true">
    <span class="mirror-stem"></span>
    <span class="mirror-housing"><span id="mirrorGlass" class="mirror-glass"></span></span>
  </div>

  <div class="cockpit" aria-hidden="true">
    <div id="dash" class="cabin dash-wrap"></div>

    <div id="cluster" class="cluster"></div>

    <div class="screen">
      <div class="screen-head"><span>NAV</span><span id="clock">06:00</span></div>
      <div class="screen-row">
        <div id="navNow" class="screen-now">Start line</div>
        <button id="demoBtn" class="screen-demo" type="button" hidden><span aria-hidden="true">▶</span> Demo</button>
      </div>
      <button id="previewBtn" class="screen-preview" type="button" hidden>
        <img id="previewImg" alt="">
        <span class="screen-preview-tag"><span aria-hidden="true">⤢</span> <span id="previewLabel">Preview</span></span>
      </button>
      <div id="navNext" class="screen-next"></div>
      <div class="screen-bar"><span id="navBar"></span></div>
    </div>

    <div id="wheel" class="cabin wheel-wrap"></div>
  </div>

  <!-- car radio: docked on the passenger side of the dash; a pop-over from the ♪ button on small screens -->
  <section id="radio" class="radio" aria-label="Car radio"></section>

  <!-- the dashboard screen, popped up into a big monitor that runs a project's live demo -->
  <div id="demo" class="demo" hidden>
    <div class="demo-backdrop" data-close></div>
    <div class="demo-monitor" role="dialog" aria-modal="true" aria-labelledby="demoTitle">
      <div class="demo-head">
        <span class="demo-live" aria-hidden="true"></span>
        <span id="demoTitle" class="demo-title">Live demo</span>
        <span id="demoUrl" class="demo-url"></span>
        <a id="demoOpen" class="demo-action" href="#" target="_blank" rel="noopener">Open in new tab <span aria-hidden="true">↗</span></a>
        <button id="demoClose" class="demo-action demo-close" type="button" data-close aria-label="Close demo">✕</button>
      </div>
      <div class="demo-body">
        <p class="demo-loading">Loading demo…</p>
        <iframe id="demoFrame" title="Live demo" allow="clipboard-write; fullscreen"></iframe>
        <img id="demoImage" class="demo-image" alt="">
      </div>
    </div>
  </div>

  <div id="track" class="track" aria-hidden="true"></div>

  <main id="static" class="static"></main>

  <noscript>
    <p class="noscript">This portfolio is an interactive drive and needs JavaScript turned on.</p>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
